[package]
name = "hivecomb"
description = "A Rust library for the Hive blockchain: keys, Graphene serialization, transaction signing and RPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The crate's own landing page. The repository README is repo-oriented and opens
# with three languages; a crates.io visitor wants the Rust one.
readme = "README.md"
# Shipped in the package: this is a derived work and the upstream copyright
# notices travel with it.
include = ["src/**/*", "data/**/*", "tests/**/*", "examples/**/*", "README.md", "LICENSE", "Cargo.toml"]
keywords = ["hive", "blockchain", "graphene", "secp256k1", "signing"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
secp256k1.workspace = true
sha2.workspace = true
ripemd.workspace = true
bs58.workspace = true
hmac.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
subtle.workspace = true
rand.workspace = true
aes = { workspace = true, optional = true }
cbc = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }
scrypt = { workspace = true, optional = true }
pbkdf2 = { workspace = true, optional = true }
unicode-normalization = { workspace = true, optional = true }
time.workspace = true

ureq = { version = "2", optional = true, default-features = false, features = ["tls", "json"] }
futures-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }

[features]
default = ["rpc", "ureq-transport", "memo", "bip38", "bip32", "wallet"]
# Encrypted key storage.
wallet = ["dep:aes-gcm", "dep:scrypt"]
# Encrypted memos (ECDH + AES-CBC).
memo = ["dep:aes", "dep:cbc"]
# BIP-38 encrypted WIF keys.
bip38 = ["dep:aes", "dep:scrypt"]
# BIP-32 / BIP-39 hierarchical deterministic keys.
bip32 = ["dep:pbkdf2", "dep:unicode-normalization"]
# The JSON-RPC layer. Disable it to keep the signing path free of any network
# dependency at all.
rpc = []
# A working blocking HTTP transport for the `rpc` layer.
ureq-transport = ["rpc", "dep:ureq"]
# The async JSON-RPC layer: an AsyncTransport trait, failover, and concurrent
# node racing. Runtime-agnostic -- it pulls in no executor, and the retry
# backoff takes a caller-supplied sleep so tokio, async-std or smol all work.
async = ["rpc", "dep:futures-util"]
# A working async HTTP transport on reqwest, plus a tokio sleeper.
reqwest-transport = ["async", "dep:reqwest", "dep:tokio"]

[dev-dependencies]
hex = "0.4"
# For `examples/bench_pipeline.rs` only, which needs to count elliptic-curve operations
# per signature and therefore has to reach the curve directly. Both are already normal
# dependencies of this crate, so this adds nothing to a consumer's build.
secp256k1 = { workspace = true }
sha2 = { workspace = true }
# For the async tests only; the library itself pulls in no executor.
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }
