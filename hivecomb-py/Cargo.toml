[package]
name = "hivecomb-py"
description = "Python bindings for hivecomb, a Hive blockchain library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "hivecomb"
crate-type = ["cdylib"]

[dependencies]
# Aliased because `[lib] name = "hivecomb"` (the Python module name) would otherwise
# shadow the dependency inside this crate.
hivecomb_core = { package = "hivecomb", path = "../hivecomb", version = "0.1.0" }
serde_json = { workspace = true }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
