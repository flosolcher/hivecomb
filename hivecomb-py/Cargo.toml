[package]
name = "hivecomb-py"
description = "Python bindings for hivecomb, a Hive blockchain library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "hivecomb"
crate-type = ["cdylib"]

[dependencies]
# Aliased because `[lib] name = "hivecomb"` (the Python module name) would otherwise
# shadow the dependency inside this crate.
# No RPC: this module exposes keys, signing, memos, mnemonics, authorities and
# the wallet, and nothing that talks to a node -- Python has `requests`. Taking
# the default features pulled in ureq -> rustls -> ring, which fails to
# cross-compile for aarch64 ("ARM assembler must define __ARM_ARCH") and broke
# the linux-aarch64 wheel. It also put an HTTP stack in a wheel that never
# calls it. The Node addon has always been built this way.
hivecomb_core = { package = "hivecomb", path = "../hivecomb", version = "0.1.0", default-features = false, features = ["memo", "bip32", "bip38", "wallet"] }
serde_json = { workspace = true }
# >= 0.29 is the floor set by two advisories against 0.22: RUSTSEC-2025-0020 (a
# buffer overflow in PyString::from_object) and RUSTSEC-2026-0177 (a missing Sync
# bound on PyCFunction::new_closure). Neither API is used here, but a published
# wheel should not ship a dependency with an open advisory against it.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
