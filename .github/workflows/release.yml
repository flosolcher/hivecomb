# Publishes to crates.io, PyPI and npm from one tag.
#
# The default is a DRY RUN. Publishing is irreversible in a way most CI is not:
# crates.io cannot unpublish, npm only within 72 hours and under conditions,
# PyPI never reuses a filename. So this workflow is built to be exercised fully
# without publishing anything, and only a pushed tag actually releases.
#
#   Rehearse:  Actions -> release -> Run workflow  (dry run: true)
#   Release:   git tag v0.1.0 && git push origin v0.1.0
#
# One-time setup before the first real release:
#
#   crates.io  CARGO_REGISTRY_TOKEN, an *environment* secret on `release` with
#              publish-new and publish-update scope. A secret, not a variable:
#              variable values are returned by the API and printed verbatim in
#              logs, which are public once this repository is.
#   npm        NPM_TOKEN, likewise an environment secret. A Granular Access
#              Token with read-and-write on all packages -- six get published,
#              and none exist to select until the first release. These expire;
#              the default is 30 days.
#   PyPI       trusted publishing configured for BOTH projects, `hivecomb` and
#              `hivecomb-beem`, each pointing at this repository and the
#              environment named below. No token is stored for PyPI.
#
# Four artifacts share one version number: the crate, the `hivecomb` wheels, the
# `hivecomb-beem` shim, and the npm package with its five platform packages.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate everything, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- guard
  guard:
    name: versions agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      dry_run: ${{ steps.check.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        shell: bash
        run: |
          set -euo pipefail

          # A tag push is the only thing that publishes.
          if [ "${{ github.event_name }}" = "push" ]; then
            dry_run=false
          else
            dry_run="${{ inputs.dry_run }}"
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          node=$(node -p "require('./hivecomb-node/package.json').version")
          shim=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml | head -1)

          echo "workspace     $crate"
          echo "npm package   $node"
          echo "hivecomb-beem $shim"

          # Four things carry this number; a mismatch ships a lie.
          for v in "$node" "$shim"; do
            if [ "$v" != "$crate" ]; then
              echo "::error::version mismatch: workspace $crate, but found $v"
              exit 1
            fi
          done

          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [ "$tag" != "$crate" ]; then
              echo "::error::tag v$tag does not match version $crate"
              exit 1
            fi
          fi

          echo "version=$crate" >> "$GITHUB_OUTPUT"

      # The changelog must actually mention what is being released. Cheap, and
      # it catches the classic "tagged without writing it down".
      - name: changelog mentions this version
        shell: bash
        run: |
          v="${{ steps.check.outputs.version }}"
          grep -q "^## \[$v\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [$v]' section"; exit 1; }

  # ------------------------------------------------------------- crates.io
  crate:
    name: crates.io
    needs: guard
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo publish --dry-run` never contacts the registry's auth, so a rehearsal
      # would say nothing about the token and the first real release would be the
      # first time it was tested. Check it explicitly instead.
      - name: the token is valid
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set on the release environment"
            exit 1
          fi
          who=$(curl -sS -H "Authorization: $CARGO_REGISTRY_TOKEN" \
                     -H "User-Agent: hivecomb-release" \
                     https://crates.io/api/v1/me)
          if ! echo "$who" | grep -q '"login"'; then
            echo "::error::crates.io rejected the token: $who"
            exit 1
          fi
          echo "crates.io accepts the token as $(echo "$who" | sed -n 's/.*"login":"\([^"]*\)".*/\1/p')"
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "${{ needs.guard.outputs.dry_run }}" = "true" ]; then
            cargo publish -p hivecomb --dry-run
          else
            cargo publish -p hivecomb
          fi

  # ------------------------------------------------------------ python wheels
  wheels:
    name: wheel ${{ matrix.name }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  os: ubuntu-latest,  target: x86_64,  manylinux: "2014" }
          - { name: linux-aarch64, os: ubuntu-latest,  target: aarch64, manylinux: "2014" }
          # Cross-compiled on the arm64 runner: Intel macOS runners sat queued for
          # an hour without starting, and both Apple targets ship with the same
          # Xcode toolchain, so a separate runner buys nothing but a dependency.
          - { name: macos-x86_64,  os: macos-latest,   target: x86_64 }
          - { name: macos-aarch64, os: macos-latest,   target: aarch64 }
          - { name: windows-x64,   os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # abi3, so one wheel per platform serves CPython 3.8 and up.
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  sdist:
    name: sdist
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-sdist
          path: dist

  # A wheel that imports is worth more than a wheel that builds.
  wheel-smoke-test:
    name: installed wheel works
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: install and check the cross-binding vector
        run: |
          python -m pip install --find-links dist --no-index hivecomb
          cd "$(mktemp -d)"    # not the repo, so the module cannot shadow it
          python - <<'EOF'
          import hivecomb
          ref = hivecomb.BlockRef.from_block_id(
              "00000005aabbccdd00000000000000000000abcd")
          tx = hivecomb.sign_transaction(
              [("custom_json", {"required_auths": [],
                                "required_posting_auths": ["alice"],
                                "id": "my_app", "json": '{"a":1}'})],
              ref, ["5KQwrPbwdL6PhXujxW37FSSQZ1JiwsST4cqQzDeyXtP79zkvFD3"])
          digest = hivecomb.transaction_digest(
              [("custom_json", {"required_auths": [],
                                "required_posting_auths": ["alice"],
                                "id": "my_app", "json": '{"a":1}'})],
              ref, "2026-08-22T14:30:00").hex()
          expected = ("cef35a5b34e7ee9297de5153b363668245793c8b"
                      "a719762ccacdde9fd85ad3d6")
          assert digest == expected, f"{digest} != {expected}"
          print("cross-binding digest vector matches:", digest)
          EOF

  pypi:
    name: PyPI (hivecomb)
    needs: [guard, wheels, sdist, wheel-smoke-test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write        # trusted publishing; no token is stored
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: needs.guard.outputs.dry_run == 'false'
        with:
          packages-dir: dist
      - name: dry run
        if: needs.guard.outputs.dry_run == 'true'
        run: |
          echo "dry run - $(ls dist | wc -l) files would be published"

  # ---------------------------------------------------- the beem drop-in shim
  pypi-shim:
    name: PyPI (hivecomb-beem)
    needs: guard
    runs-on: ubuntu-latest
    # A separate environment, forced by PyPI: it permits only one *pending*
    # publisher per (owner, repository, workflow, environment), so two pending
    # publishers differing only in project name are rejected with "already been
    # registered for a different project name". Giving this job its own
    # environment makes the two configurations distinct. It holds no secrets --
    # trusted publishing needs none.
    environment: release-beem
    permissions:
      # `contents: read` must be repeated here. A job-level permissions block
      # REPLACES the workflow-level one rather than adding to it, so declaring only
      # id-token left this job with no read access and actions/checkout failed with
      # "Repository not found" -- which reads like a missing repo, not a permission.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pure Python: one sdist and one wheel serve every platform.
      - run: python -m pip install build
      - run: python -m build --outdir ../dist-shim
        working-directory: python
      - run: ls -la dist-shim
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: needs.guard.outputs.dry_run == 'false'
        with:
          packages-dir: dist-shim
      - name: dry run
        if: needs.guard.outputs.dry_run == 'true'
        run: |
          echo "dry run - $(ls dist-shim | wc -l) files would be published"

  # -------------------------------------------------------------- node addon
  node-build:
    name: addon ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          # aarch64 Linux needs napi's cross toolchain (zig, a sysroot). Built here
          # rather than on an arm runner, which is not available on every plan for a
          # private repository.
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,
              napi_cross: true, skip_test: true }
          # Intel macOS needs no cross toolchain at all -- both Apple targets ship
          # with the same Xcode -- only `rustup target add`, which the toolchain
          # action does. Built here because the Intel runners sat queued for an hour
          # without ever starting.
          - { os: macos-latest,   target: x86_64-apple-darwin, skip_test: true }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm install
        working-directory: hivecomb-node
      - name: build
        working-directory: hivecomb-node
        shell: bash
        run: |
          if [ "${{ matrix.napi_cross }}" = "true" ]; then
            npx napi build --platform --release \
              --target ${{ matrix.target }} --use-napi-cross
          else
            npx napi build --platform --release --target ${{ matrix.target }}
          fi
      # A binary that cannot run on the builder cannot be tested on it.
      - name: test
        if: matrix.skip_test != true
        working-directory: hivecomb-node
        run: npm test
      - uses: actions/upload-artifact@v5
        with:
          name: addon-${{ matrix.target }}
          path: hivecomb-node/*.node
          if-no-files-found: error

  npm:
    name: npm
    needs: [guard, node-build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm install
        working-directory: hivecomb-node
      - uses: actions/download-artifact@v5
        with:
          pattern: addon-*
          merge-multiple: true
          path: hivecomb-node/artifacts
      - name: assemble the platform packages
        working-directory: hivecomb-node
        run: |
          ls -la artifacts
          npx napi create-npm-dirs
          npx napi artifacts --output-dir artifacts
          ls -R npm
      # `npm publish --dry-run` does not authenticate either; `npm whoami` does.
      - name: the token is valid
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set on the release environment"
            exit 1
          fi
          echo "npm accepts the token as $(npm whoami)"
      - name: publish
        working-directory: hivecomb-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ needs.guard.outputs.dry_run }}" = "true" ]; then
            npx napi pre-publish -t npm --dry-run
            npm publish --dry-run
          else
            npx napi pre-publish -t npm
            npm publish --access public
          fi
