# Everything here runs offline. Checks that talk to a Hive node live in
# live-oracles.yml, because a public node being slow must never fail a pull
# request — and because a scheduled run is how you notice a hardfork changed
# something under you.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # RUSTFLAGS is deliberately NOT set here. Setting it replaces, rather than
  # adds to, the per-target rustflags in .cargo/config.toml -- which is what
  # lets hivecomb-py link on macOS. Warnings are still a hard error, via the
  # clippy and rustdoc steps in the `lint` job.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          # The declared MSRV, which is only meaningful if something checks it.
          # Keep in step with `rust-version` in the workspace Cargo.toml.
          - os: ubuntu-latest
            rust: "1.88"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      # `--locked` on every cargo command that resolves dependencies, here and in
      # each job below. Without it cargo quietly rewrites Cargo.lock to match a
      # changed manifest and the job passes, so a commit that updates Cargo.toml
      # and forgets the lock is invisible until someone builds from the packaged
      # crate. That happened on 2026-08-25. It has to be every command, not just
      # this one: the first unlocked cargo call in a job repairs the lock and
      # hides the mismatch from everything after it.
      - name: build
        run: cargo build --locked --workspace --all-features
      - name: test
        run: cargo test --locked --workspace --all-features

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The signing core must keep building with no HTTP client and no executor.
      # That property is easy to lose to a stray `use` and invisible in a
      # default build, so it is checked explicitly rather than assumed.
      - name: no default features
        run: cargo build --locked -p hivecomb --no-default-features
      - name: each feature alone
        run: |
          for f in rpc ureq-transport memo bip38 bip32 wallet async; do
            echo "::group::$f"
            cargo build --locked -p hivecomb --no-default-features --features "$f"
            echo "::endgroup::"
          done
      - name: async without a bundled transport
        run: cargo build --locked -p hivecomb --no-default-features --features async
      - name: reqwest transport
        run: cargo build --locked -p hivecomb --no-default-features --features reqwest-transport
      - name: all features
        run: cargo build --locked -p hivecomb --all-features

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned, deliberately, where every other job floats on `stable`.
      #
      # Clippy gains lints every six weeks and rustfmt occasionally changes what it
      # considers formatted. On a floating toolchain that turns this job red with no
      # change to this repository -- 1.98 added `chunks_exact_to_as_chunks` and did
      # exactly that -- so main can break while nobody is touching it, and a
      # contributor cannot reproduce the gate without guessing which toolchain ran it.
      #
      # Tests stay on `stable` on purpose: there the floating version is the point,
      # and a new compiler breaking the tests is a real finding rather than a lint
      # opinion. `lint-latest` below keeps the early warning for this job without
      # letting it block anyone.
      #
      # Bump this deliberately, when `lint-latest` says there is something to bump for.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked -p hivecomb --no-default-features -- -D warnings
      - name: docs build without warnings
        run: cargo doc --locked -p hivecomb --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  lint-latest:
    name: clippy on latest stable (advisory)
    runs-on: ubuntu-latest
    # Never blocks. Its whole job is to notice, before the pinned gate is bumped, that
    # a newer clippy has an opinion about this code -- so the bump is a small deliberate
    # commit rather than a surprise the next time someone pushes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: rustc --version && cargo clippy --version
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked -p hivecomb --no-default-features -- -D warnings

  docs:
    name: documentation says what is true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Counts in the documentation drift silently: each is true the day it is
      # typed and nobody re-reads it. On 2026-08-24 the same test count appeared
      # as 292, 295 and 305 across four files while the real number was 337.
      # These figures sit beside comparisons with other people's projects, so
      # they are checked rather than trusted. Also verifies that every local
      # link and anchor resolves, because a claim about another project is
      # supposed to link to its evidence.
      - name: documented figures, links and duplicated tables
        run: python3 tests/doc_stats.py

  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # abi3, so one wheel serves all of these. Testing the ends catches an
        # accidental dependency on a version-specific detail.
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: build the extension module
        run: |
          cargo build --locked --release -p hivecomb-py
          mkdir -p dist
          cp target/release/libhivecomb.so dist/hivecomb.so
      - name: compatibility suite
        env:
          PYTHONPATH: dist:python
          # Never inherit a developer's real config into a test run: test_cli
          # mutates whatever COMB_CONFIG points at.
          COMB_CONFIG: ${{ runner.temp }}/comb-config.json
        run: python python/test_compat.py
      - name: CLI suite
        env:
          PYTHONPATH: dist:python
          COMB_CONFIG: ${{ runner.temp }}/comb-cli-config.json
        run: python python/test_cli.py

  node:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Node 20's LTS maintenance ended in April 2026, so it is not tested and
        # `engines` no longer claims it. 22 is in maintenance, 24 is current LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
        working-directory: hivecomb-node
      - run: npm run build
        working-directory: hivecomb-node
      - run: npm test
        working-directory: hivecomb-node

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A signing library inherits its dependencies' vulnerabilities. This checks the
      # tree against the RustSec advisory database.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  packaging:
    name: crate packages cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The comparison harness is a second, separate workspace with its own
          # target directory; without naming it here it would compile from cold
          # on every run.
          workspaces: |
            .
            benches/rust-libraries
      # Catches a file that only exists locally, or one that should not ship.
      - run: cargo package --locked -p hivecomb
      - name: list what would be published
        run: cargo package --locked -p hivecomb --list
      # The comparison harness lives outside the workspace and keeps its own
      # lock, so nothing above resolves or compiles it. Two different things rot
      # there unseen: its lock drifts from its manifest (it depends on hivecomb
      # by path, so a change to hivecomb's dependencies invalidates it), and it
      # stops compiling when an API it calls changes. `check --locked` catches
      # both, and the numbers in COMPARISON.md come out of this harness, so a
      # version of it that no longer builds is a real gap rather than a tidiness
      # one. ~27 s cold, and the cache above keeps it well under that.
      - name: benchmark harness compiles against the current API
        working-directory: benches/rust-libraries
        run: cargo check --locked --all-targets
