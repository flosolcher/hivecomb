# The checks that ask a Hive node whether we are still right.
#
# These are the highest-value tests in the project — on 2026-08-22 the
# serialization oracle found four defects that 292 unit tests and the beem
# differential oracle had all missed — but they are also the only ones that can
# fail for reasons that have nothing to do with this repository: a node being
# slow, a node being down, rate limiting.
#
# So they run on a schedule and on demand, never as a gate on a pull request.
# A scheduled run is also how a hardfork that changes serialization gets
# noticed, which is the failure mode no offline test can ever catch.
name: live oracles

on:
  schedule:
    # Daily. The chain does not change often, but when it does, this is the
    # thing that says so.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      account:
        description: "Account to read for the authority oracle (never signed for)"
        required: false
        default: "noc-dev"

permissions:
  contents: read
  issues: write
  checks: write

concurrency:
  group: live-oracles
  cancel-in-progress: false

jobs:
  # An advisory is published against a dependency without anyone touching this
  # repository, which is the same reason the oracles run on a schedule.
  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Coverage-guided fuzzing of every parser that takes untrusted bytes. Runs on the
  # schedule rather than per-commit because it is time-boxed exploration, not a gate:
  # a fixed-corpus version of the same contract runs on every commit as
  # hivecomb/tests/hostile_input.rs.
  #
  # Needs nightly, which is why the fuzz crate is outside the workspace -- the
  # library stays pinned to stable with a measured MSRV.
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [reader, transaction, memo, keys]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # Every target's assertions sit behind `if let Ok(..)`, so a corpus that never
      # parses produces a target that cannot fail -- "no bug found" and "nothing was
      # tested" look identical. The previous seeds here were three hand-written byte
      # strings and **none of them parsed as a transaction body**, so that target had
      # been reporting success without executing its round-trip check. These seeds are
      # emitted by the crate itself, so the interesting branch is reachable by
      # construction.
      - name: seed the corpus with input the crate produced
        run: |
          cargo run --release --example emit_fuzz_seeds \
            --no-default-features --features memo -- fuzz/corpus
          echo "seeds for ${{ matrix.target }}:"
          ls -la "fuzz/corpus/${{ matrix.target }}" 2>/dev/null || {
            echo "::error::no corpus for ${{ matrix.target }} -- it would fuzz from nothing"
            exit 1
          }
      - name: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=240 -timeout=10
        working-directory: fuzz
      - name: keep any crash that was found
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  oracles:
    name: hived oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build the extension module
        run: |
          cargo build --release -p hivecomb-py
          mkdir -p dist
          cp target/release/libhivecomb.so dist/hivecomb.so

      # Does hived serialize every operation to the same bytes we do? This needs
      # no account and no key, and writes nothing to the chain.
      - name: serialization oracle
        env:
          PYTHONPATH: dist
        run: python tests/hived_serialization_oracle.py

      # Does every operation ask for the authority hived requires? Also keyless:
      # get_potential_signatures answers it from an unsigned transaction.
      - name: authority oracle
        env:
          PYTHONPATH: dist
          HIVE_ACCOUNT: ${{ github.event.inputs.account || 'noc-dev' }}
        run: python tests/hived_authority_oracle.py

      - name: open an issue if an oracle failed
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Live oracle failed on ' +
              new Date().toISOString().slice(0, 10);
            // Do not pile up one issue per day for the same outage.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'live-oracle',
            });
            if (existing.data.length > 0) {
              core.info('An open live-oracle issue already exists; not filing another.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['live-oracle'],
              body: [
                'A scheduled live oracle run failed.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                  `/actions/runs/${context.runId}`,
                '',
                'This is either a public node being unavailable — in which case',
                're-run it and close this — or hived changed something we',
                'encode. The second case is the reason this workflow exists.',
                '',
                'Check the serialization oracle first: it names the operation',
                'whose digest stopped matching.',
              ].join('\n'),
            });
