[workspace]
resolver = "2"
members = ["hivecomb", "hivecomb-py", "hivecomb-node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/flosolcher/hivecomb"
authors = ["The hivecomb contributors"]

[workspace.dependencies]
secp256k1 = { version = "0.29", features = ["recovery", "global-context", "rand-std"] }
sha2 = "0.10"
ripemd = "0.1"
bs58 = "0.5"
hmac = "0.12"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
rand = "0.8"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
pbkdf2 = { version = "0.12", default-features = false }
unicode-normalization = "0.1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", default-features = false }

[profile.release]
# Worth the build time for what ships: the native addons are loaded by other
# runtimes, where binary size and call overhead are paid by every consumer.
lto = true
codegen-units = 1
strip = true
